name: ArbiLex
description: >-
  ArbiLex is a legal-fintech startup founded at the Harvard Innovation Labs in
  2018 by Isabel Yang that brings AI and predictive analytics to high-stakes
  international arbitration and litigation finance. Its Bayesian machine learning
  and NLP models — trained on a dataset of over nine million cases — produce
  empirical, explainable case ratings that help counsel quantify uncertainty,
  reduce errors, and value claims. ArbiLex also operates the ArbiLex Funding
  Exchange (AFX), a data-driven marketplace pairing AI-rated cases with
  litigation-finance capital. Added to the API Evangelist network as a portfolio
  company of 500 Global; no public developer API surface was found at time of
  enrichment.
